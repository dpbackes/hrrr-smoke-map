<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRRR Smoke Forecast</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <header class="glass-panel">
            <h1>HRRR Smoke Forecast</h1>
            <p class="subtitle">High-Resolution Rapid Refresh Model</p>
        </header>

        <main>
            <div id="map"></div>
            
            <div id="controls" class="glass-panel">
                <div class="timeline-header">
                    <span id="current-time">Loading timeline...</span>
                    <span id="forecast-hour" class="badge">F00</span>
                </div>
                
                <div class="slider-container">
                    <button id="play-btn" class="btn-icon" aria-label="Play animation">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="play-icon"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="pause-icon" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </button>
                    <input type="range" id="time-slider" min="0" max="12" value="0" step="1">
                </div>
                
                <div class="legend">
                    <span class="legend-label">Good (AQI 0-50)</span>
                    <div class="color-bar"></div>
                    <span class="legend-label">Hazardous (AQI 300+)</span>
                </div>
                <div class="metadata-info">
                    Model Run: <span id="model-run">--</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
